name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Least Privilege Invariant
permissions:
  contents: read

jobs:
  validate:
    name: Validate Python & Security Posture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python Syntax
        run: |
          python -m py_compile mcp/*.py
          echo "✔ Python source compiled cleanly."

      - name: Validate JSON Manifests
        run: |
          python -c "
          import json, glob
          for f in glob.glob('**/*.json', recursive=True):
              with open(f, 'r') as fp:
                  json.load(fp)
              print(f'✔ JSON OK: {f}')
          "


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-play-console-mcp"
version = "1.0.0"
description = "Production-grade Model Context Protocol (MCP) server for Google Play Console and Android Developer API automation."
readme = "README.md"
authors = [
    { name = "Karan Singh Verma", email = "karansinghverma979@gmail.com" }
]
license = { text = "MIT" }
keywords = ["mcp", "google-play", "play-console", "android", "fastmcp", "ai-agents", "antigravity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/karansinghverma979/antigravity-play-console-mcp"
Repository = "https://github.com/karansinghverma979/antigravity-play-console-mcp"

[project.scripts]
antigravity-play-console-mcp = "src.server:main"

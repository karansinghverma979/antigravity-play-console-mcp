<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#091024" />
      <stop offset="80%" stop-color="#060C1B" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Google Play Facet Gradients -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>

    <linearGradient id="greenFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="amberFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <linearGradient id="coralFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D500F9" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Cybernetic Grid -->
  <g opacity="0.05" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="450" x2="1200" y2="450" />

    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
    <line x1="1100" y1="0" x2="1100" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="210" cy="250" r="160" fill="#00F0FF" opacity="0.10" filter="url(#glow)" />
  <circle cx="1060" cy="130" r="140" fill="#00E676" opacity="0.08" filter="url(#glow)" />

  <!-- LEFT EMBLEM: Radiant Play Console Core -->
  <g transform="translate(60, 90)">
    <!-- Track Orbits -->
    <circle cx="160" cy="160" r="145" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="160" cy="160" r="155" fill="none" stroke="#00E676" stroke-width="1" stroke-dasharray="3 10" opacity="0.6" />

    <!-- Track Nodes -->
    <circle cx="315" cy="160" r="5" fill="#00F0FF" filter="url(#subtleGlow)" />
    <circle cx="5" cy="160" r="5" fill="#00E676" filter="url(#subtleGlow)" />
    <circle cx="160" cy="5" r="5" fill="#FFD600" filter="url(#subtleGlow)" />
    <circle cx="160" cy="315" r="5" fill="#FF5252" filter="url(#subtleGlow)" />

    <!-- Play Triangle Core -->
    <g transform="translate(60, 60)" filter="url(#glow)">
      <path d="M 30 20 L 30 180 L 120 100 Z" fill="url(#cyanFacet)" opacity="0.95" />
      <path d="M 30 20 L 120 100 L 175 100 Z" fill="url(#greenFacet)" opacity="0.95" />
      <path d="M 30 180 L 120 100 L 175 100 Z" fill="url(#amberFacet)" opacity="0.95" />
      <path d="M 120 100 L 175 100 L 160 85 Z" fill="url(#coralFacet)" opacity="0.95" />
      <path d="M 30 20 L 175 100 L 30 180 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.8" />
    </g>

    <!-- Center Pulse -->
    <circle cx="160" cy="160" r="14" fill="#060A14" stroke="#00F0FF" stroke-width="2" />
    <circle cx="160" cy="160" r="6" fill="#00E676" filter="url(#subtleGlow)" />

    <!-- Status Strip Below Core -->
    <rect x="70" y="280" width="180" height="26" rx="6" fill="#0F172A" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="86" cy="293" r="4" fill="#00E676" filter="url(#subtleGlow)" />
    <text x="98" y="297" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
      API V3: ONLINE
    </text>
  </g>

  <!-- RIGHT SECTION: Header, Pods & Metadata -->
  <!-- Titles -->
  <g transform="translate(420, 65)">
    <!-- Antigravity Tag -->
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1" />
    <text x="10" y="16" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="2">
      GOOGLE ANTIGRAVITY PLUGIN
    </text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      PLAY CONSOLE
    </text>
    <text x="355" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="300" fill="#00F0FF" letter-spacing="-0.5">
      // SENTINEL
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8" letter-spacing="0.2">
      Autonomous Android Publisher, Phased Rollout Governor &amp; Store Listing Sentinel
    </text>
  </g>

  <!-- 3 Capability Cards -->
  <g transform="translate(420, 195)">
    <!-- Card 1: AAB Uploader & Tracks -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="195" rx="12" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />
      <circle cx="28" cy="28" r="14" fill="#00F0FF" fill-opacity="0.15" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="14">📦</text>
      <text x="52" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Bundle &amp; Tracks</text>
      
      <line x1="16" y1="52" x2="214" y2="52" stroke="#334155" stroke-width="1" />
      
      <text x="16" y="75" font-family="'Consolas', monospace" font-size="11" fill="#00F0FF">• .AAB Chunked Upload</text>
      <text x="16" y="95" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  Auto-extract versionCode</text>
      <text x="16" y="120" font-family="'Consolas', monospace" font-size="11" fill="#00F0FF">• Multi-Track Routing</text>
      <text x="16" y="140" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  Internal, Alpha, Beta</text>
      <text x="16" y="165" font-family="'Consolas', monospace" font-size="11" fill="#00F0FF">• Release Notes BCP-47</text>
    </g>

    <!-- Card 2: Staged Rollout Governor -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="230" height="195" rx="12" fill="url(#cardGrad)" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.5" />
      <circle cx="28" cy="28" r="14" fill="#00E676" fill-opacity="0.15" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="14">🚀</text>
      <text x="52" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Staged Rollouts</text>
      
      <line x1="16" y1="52" x2="214" y2="52" stroke="#334155" stroke-width="1" />
      
      <text x="16" y="75" font-family="'Consolas', monospace" font-size="11" fill="#00E676">• Phased Deployments</text>
      <text x="16" y="95" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  5% -> 10% -> 25% -> 100%</text>
      <text x="16" y="120" font-family="'Consolas', monospace" font-size="11" fill="#00E676">• Halt &amp; Resume Control</text>
      <text x="16" y="140" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  Spike error mitigation</text>
      <text x="16" y="165" font-family="'Consolas', monospace" font-size="11" fill="#00E676">• Production Guard Barrier</text>
    </g>

    <!-- Card 3: Store Listings & Reviews -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="250" height="195" rx="12" fill="url(#cardGrad)" stroke="#FFD600" stroke-width="1.5" stroke-opacity="0.5" />
      <circle cx="28" cy="28" r="14" fill="#FFD600" fill-opacity="0.15" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="14">📝</text>
      <text x="52" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Listings &amp; Reviews</text>
      
      <line x1="16" y1="52" x2="234" y2="52" stroke="#334155" stroke-width="1" />
      
      <text x="16" y="75" font-family="'Consolas', monospace" font-size="11" fill="#FFD600">• Metadata Limit Guard</text>
      <text x="16" y="95" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  Title 30 / Short 80 chars</text>
      <text x="16" y="120" font-family="'Consolas', monospace" font-size="11" fill="#FFD600">• Multi-Locale Sync</text>
      <text x="16" y="140" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">  en-US, hi-IN, es-419</text>
      <text x="16" y="165" font-family="'Consolas', monospace" font-size="11" fill="#FFD600">• User Review Triaging</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(40, 435)">
    <rect x="0" y="0" width="1120" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="24" y="24" font-family="'Consolas', monospace" font-size="12" fill="#00E676">
      ● OPENSSF HARDENED
    </text>
    <text x="210" y="24" font-family="'Consolas', monospace" font-size="12" fill="#00F0FF">
      ● SOVEREIGN EXTERNAL QUARANTINE
    </text>
    <text x="520" y="24" font-family="'Consolas', monospace" font-size="12" fill="#FFD600">
      ● 9 PYTHON STDIO MCP TOOLS
    </text>
    <text x="780" y="24" font-family="'Consolas', monospace" font-size="12" fill="#FF5252">
      ● PRODUCTION SAFETY BARRIER
    </text>
    <text x="1040" y="24" font-family="'Consolas', monospace" font-size="12" fill="#00E676">
      ● ZERO LEAKS
    </text>
  </g>
</svg>

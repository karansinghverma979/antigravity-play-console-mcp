<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Google Play Facet Gradients -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>

    <linearGradient id="greenFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="amberFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <linearGradient id="coralFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D500F9" />
    </linearGradient>

    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#primaryNeon)" stroke-width="4" stroke-opacity="0.7" />

  <!-- Subtle Cybernetic HUD Grid -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1.5">
    <line x1="64" y1="64" x2="448" y2="64" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="64" y1="448" x2="448" y2="448" />

    <line x1="64" y1="64" x2="64" y2="448" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="448" y1="64" x2="448" y2="448" />
  </g>

  <!-- Glowing Corner Markers -->
  <path d="M 36 80 L 36 36 L 80 36" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />
  <path d="M 476 80 L 476 36 L 432 36" fill="none" stroke="#00E676" stroke-width="3" opacity="0.8" />
  <path d="M 36 432 L 36 476 L 80 476" fill="none" stroke="#FFD600" stroke-width="3" opacity="0.8" />
  <path d="M 476 432 L 476 476 L 432 476" fill="none" stroke="#FF5252" stroke-width="3" opacity="0.8" />

  <!-- Orbiting Release Tracks -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35" />
  <circle cx="256" cy="240" r="190" fill="none" stroke="#00E676" stroke-width="1" stroke-dasharray="2 12" opacity="0.45" />

  <!-- Track Nodes on Orbit -->
  <circle cx="426" cy="240" r="6" fill="#00F0FF" filter="url(#subtleGlow)" />
  <circle cx="86" cy="240" r="6" fill="#00E676" filter="url(#subtleGlow)" />
  <circle cx="256" cy="70" r="6" fill="#FFD600" filter="url(#subtleGlow)" />
  <circle cx="256" cy="410" r="6" fill="#FF5252" filter="url(#subtleGlow)" />

  <!-- Central Cybernetic Play Triangle Core -->
  <g transform="translate(146, 120)" filter="url(#neonGlow)">
    <!-- Base Large Play Triangle Shape Divided into 4 Prisms -->
    <!-- Left Blue / Cyan Prism -->
    <path d="M 30 20 L 30 220 L 135 120 Z" fill="url(#cyanFacet)" opacity="0.95" />
    <!-- Top Green Prism -->
    <path d="M 30 20 L 135 120 L 205 120 Z" fill="url(#greenFacet)" opacity="0.95" />
    <!-- Bottom Amber / Orange Prism -->
    <path d="M 30 220 L 135 120 L 205 120 Z" fill="url(#amberFacet)" opacity="0.95" />
    <!-- Right Coral / Violet Point Prism -->
    <path d="M 135 120 L 205 120 L 185 105 Z" fill="url(#coralFacet)" opacity="0.95" />
    
    <!-- Outer Shield / Boundary Stroke -->
    <path d="M 30 20 L 205 120 L 30 220 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8" />
  </g>

  <!-- Central Pulse Eye -->
  <circle cx="256" cy="240" r="16" fill="#060A14" stroke="#00F0FF" stroke-width="2.5" />
  <circle cx="256" cy="240" r="7" fill="#00E676" filter="url(#subtleGlow)" />
  <circle cx="256" cy="240" r="2.5" fill="#FFFFFF" />

  <!-- Dynamic Bottom HUD Labels -->
  <text x="256" y="445" text-anchor="middle" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#00F0FF" letter-spacing="3">
    PLAY CONSOLE // SENTINEL
  </text>
  <text x="256" y="468" text-anchor="middle" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="11" fill="#00E676" letter-spacing="2">
    ANDROID PUBLISHER • STAGED ROLLOUT
  </text>
</svg>
